# Usage:
# cargo run -- chaos --config chaosfilter.toml

# Name of chaos plan
name = "netem-test"

[targets]
# Can target explicitly or set to "default" to use the current system default.
iface = "enp34s0"
cgroup = "77500" # Optional

[schedule]
duration_s = 10

# qdisc injector
[injectors.network_config]
# Master enable flag for the network injector
# When set to true, the injector will apply network constraints
# defined by the fields below. If set to false, this configuration 
# will be ignored at runtime.
enabled = true

target_iface = "enp34s0"
delay_ms = 100
loss_percent = 45.0

[injectors.memory_config]
# Master enable flag for the memory injector
# When set to true, the injector will actively apply CPU and memory constraints
# defined below. If set to false, this entire configuration block is ignored at
# runtime, allowing you to keep settings defined without enforcing them.

enabled = false
# The process ID (pid) that resource limits will be applied to. This tells the
# injector which running process should be moved into the configured cgroup and
# constrained. If the PID does not exist or is not accesible, the injector will
# fail to apply limits.

target_pid = 1234

# Controls whether the specified PID should be moved into the target cgroup
# before applying new limits. This ensures the process becomes subject to the
# configured CPU and memory restrictions. If set to false, limits will only apply
# if the process is already inside the target cgroup
move_pid = true

# List of cgroup v2 controllers to enable in the parent cgroup.subtree_control
# file. Controllers must be enabled before resource limit files (like cpu.max
# or memory.max) become available in the child cgroup. Common values are "cpu"
# and "memory"
enable = ["cpu", "memory"]

#
# cpu.max format: "<quota> <period>" OR "max <period>"
# Example below: 20ms of CPU time per 100ms period (~20% of one CPU).
# cpu_max = "20000 100000"
cpu_max = "20000 100000"


# cpu.weight: relative CPU share (1 - 10000). Higher = more CPU time under contention.
cpu_weight = 200
# Hard memory limit for the cgroup. This defines the maximum amount of memory
# processes in this cgroup are allowed to allocate. If the limit is exceeded,
# the kernel may invoke the OOM killer to terminate processes. Units such as
# K, M, and G are supported
mem_max = "1G"
# Soft memory limit threshold. When memory usage exceeds this value, the kernel
# will apply memory pressure and throttle allocations instead of immediately
# killing processes. This provided a gradual degredation model. Useful for 
# testing how applications respond to memory stress.
mem_high = "800M"
# Maximum swap usage allowed. Controls how much swap space the cgroup may use
# after RAM is exhausted. Setting this to "0" disables swap completely. 
# Setting itto "max" allows unlimited swap usage.
swap_max= "0"

# Block I/O Injector
[injectors.block_config]
# The master enable flag for storage injection.  When set to true, the injector 
# will actively apply Block I/O constraints based on the vaules for the variables
# below. If set to false, this whole section of the configuration file is ignored 
# at runtime. This allows the user to 'cherry-pick' which section(s) they want to use.
enabled = true
# The target device that the I/O constraints will be applied to. This needs to be a 
# valid device path based on the device type you are targeting e.g. "/dev/sda", 
# "/dev/nvme01", or "/dev/loop0". It is a placeholder value at the moment but will
# be updated accordingly when implementation is integrated
device = "/dev/placeholder"
# Read bandwidth limit (bytes per second). This value restricts the maximum sustained
# read throughput for the defined device in the configured cgroup. It must be specified
# in raw bytes per second e.g. 1048576 would be 1 MB/s and 10485760 would be 10 MB/s.
# Also a placeholder at this time and will be updated to a realistic value in the final product.
rbps = 1234567
# Write bandwidth limit (bytes per second). When configured it defines the maximum write throughput
# for the target device in the configured cgroup. Like rbps this vaule must be given in raw bytes
# per second. If left unset or configured incorrectly write throttling may not behave as
# expected. Also a placeholder until final product in which a realistic value will be set. 
wbpd = 1234567
