[package]
name = "chaosfilter"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
chaosfilter-common = { path = "../chaosfilter-common", features = ["user"] }
anyhow = { workspace = true, default-features = true }
aya = { workspace = true }
aya-log = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
ctrlc = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
toml_edit = "0.25.4"
libc = "0.2"
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "signal",
] }
tracing = "0.1.44"

[build-dependencies]
anyhow = { workspace = true }
aya-build = { workspace = true }
cargo_metadata = { workspace = true }
chaosfilter-ebpf = { path = "../chaosfilter-ebpf" }

[[bin]]
name = "chaosfilter"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
