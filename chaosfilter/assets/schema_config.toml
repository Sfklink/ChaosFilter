# ChaosFilter Example Configuration
#
# Usage:
#   chaosfilter chaos --config cf-config.toml
#
# This file defines:
#   - Targets (what to affect)
#   - Schedule (how long to apply chaos)
#   - Injectors (what kind of chaos to apply)

# --------------------------------------------------
# Plan Metadata
# --------------------------------------------------

name = "example-plan"

# --------------------------------------------------
# Targets
# --------------------------------------------------

[targets]
# Network interface to target (e.g. eth0, enp5s0, vethA)
# Can set to "default" to select the current system default
# network interface.
iface = "default"

# Optional: cgroup path relative to /sys/fs/cgroup (cgroup v2)
# Example: "77500" or "system.slice/my.service"

cgroup = "0"

# --------------------------------------------------
# Schedule
# --------------------------------------------------

[schedule]
# Duration to keep chaos active (seconds)
duration_s = 10

# ==================================================
# Injectors
# ==================================================

# -----------------------------
# Network (tc netem)
# -----------------------------
[injectors.network_config]
enabled = false

# Optional override (defaults to targets.iface)
target_iface = "default"

# Network delay (ms)
delay_ms = 100

# Packet loss percentage (0.0 - 100.0)
loss_percent = 10.0

# -----------------------------
# CPU + Memory (cgroup v2)
# -----------------------------
[injectors.memory_config]
enabled = false

# PID to constrain
target_pid = 0

# Move PID into target cgroup before applying limits
move_pid = true

# Controllers to enable in cgroup.subtree_control
enable = ["cpu", "memory"]

# CPU quota/period (e.g. "20000 100000" = 20% of one CPU)
cpu_max = "20000 100000"

# CPU weight (1 - 10000)
cpu_weight = 200

# Hard memory limit
mem_max = "1G"

# Soft memory pressure threshold
mem_high = "800M"

# Swap limit ("0" disables swap, "max" allows unlimited)
swap_max = "0"

# -----------------------------
# Block I/O (cgroup v2 io)
# -----------------------------

# Block I/O Injector
[injectors.block_config]
enabled = true

# The target device that the I/O constraints will be applied to.
device = "/dev/sda"

# Read bandwidth limit (bytes per second).
rbps = 10485760

# Write bandwidth limit (bytes per second).
wbpd = 10485760