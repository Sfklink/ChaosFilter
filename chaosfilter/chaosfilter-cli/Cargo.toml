[package]
name = "chaosfilter-cli"
version = "0.1.0"
license.workspace = true
edition.workspace = true

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
anyhow = "1"
thiserror = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rtnetlink = "0.14"
netlink-packet-route = "0.19"
futures-util = "0.3"

[[bin]]
name = "chaosfilter"
path = "src/main.rs"